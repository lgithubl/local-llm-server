name: Interactive Sakura

on:
  workflow_dispatch:
    inputs:
      image:
        description: Runtime image to run
        required: false
        default: ghcr.io/lgithubl/local-llm-server:latest
      model_url:
        description: Direct GGUF download URL
        required: false
        default: https://huggingface.co/SakuraLLM/Sakura-7B-Qwen2.5-v1.0-GGUF/resolve/main/sakura-7b-qwen2.5-v1.0-iq4xs.gguf
      model_name:
        description: Model name exposed in requests
        required: false
        default: sakura
      minutes:
        description: Minutes to keep endpoint alive
        required: false
        default: "60"

permissions:
  contents: read
  packages: read

jobs:
  interactive:
    name: Start temporary Sakura endpoint
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Login to GitHub Container Registry
        if: ${{ startsWith(inputs.image, 'ghcr.io/') }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image
        run: docker pull "${{ inputs.image }}"

      - name: Download Sakura model
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/models"
          curl -L --retry 5 --retry-delay 5 \
            "${{ inputs.model_url }}" \
            -o "$RUNNER_TEMP/models/model.gguf"
          ls -lh "$RUNNER_TEMP/models/model.gguf"

      - name: Start Sakura server
        shell: bash
        run: |
          docker run -d --name local-llm-server \
            -p 8080:8080 \
            -v "$RUNNER_TEMP/models:/models:ro" \
            -e MODEL_TYPE=sakura \
            -e MODEL_PATH=/models/model.gguf \
            -e N_GPU_LAYERS=0 \
            -e CTX_SIZE=2048 \
            -e LLAMA_SERVER_ARGS="--alias ${{ inputs.model_name }}" \
            "${{ inputs.image }}"

      - name: Wait for server
        shell: bash
        run: |
          for i in $(seq 1 180); do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null; then
              exit 0
            fi
            docker logs --tail 80 local-llm-server || true
            sleep 5
          done
          docker logs local-llm-server || true
          exit 1

      - name: Smoke test
        shell: bash
        run: |
          curl -fsS http://127.0.0.1:8080/v1/chat/completions \
            -H 'Content-Type: application/json' \
            -d '{"model":"${{ inputs.model_name }}","messages":[{"role":"user","content":"将下面日文翻译成简体中文：こんにちは。"}],"stream":false,"max_tokens":80}' \
            | tee "$RUNNER_TEMP/smoke.json"

      - name: Start authenticated proxy
        id: auth
        shell: bash
        run: |
          USERNAME="llm"
          PASSWORD="$(openssl rand -base64 18 | tr -d '=+/')"
          {
            echo "username=$USERNAME"
            echo "password=$PASSWORD"
          } >> "$GITHUB_OUTPUT"
          cat >/tmp/basic_proxy.py <<'PY'
          import base64
          import http.server
          import os
          import urllib.error
          import urllib.request

          TARGET = "http://127.0.0.1:8080"
          USERNAME = os.environ["BASIC_USER"]
          PASSWORD = os.environ["BASIC_PASS"]
          EXPECTED = "Basic " + base64.b64encode(f"{USERNAME}:{PASSWORD}".encode()).decode()
          HOP_BY_HOP = {"connection", "keep-alive", "proxy-authenticate", "proxy-authorization", "te", "trailers", "transfer-encoding", "upgrade"}

          class Proxy(http.server.BaseHTTPRequestHandler):
              protocol_version = "HTTP/1.1"

              def _unauthorized(self):
                  body = b"Authentication required\n"
                  self.send_response(401)
                  self.send_header("WWW-Authenticate", 'Basic realm="local-llm-server"')
                  self.send_header("Content-Type", "text/plain")
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)

              def _proxy(self):
                  if self.headers.get("Authorization") != EXPECTED:
                      self._unauthorized()
                      return
                  length = int(self.headers.get("Content-Length") or 0)
                  body = self.rfile.read(length) if length else None
                  headers = {
                      k: v for k, v in self.headers.items()
                      if k.lower() not in HOP_BY_HOP and k.lower() != "host"
                  }
                  headers.pop("Authorization", None)
                  req = urllib.request.Request(TARGET + self.path, data=body, headers=headers, method=self.command)
                  try:
                      with urllib.request.urlopen(req, timeout=900) as resp:
                          payload = resp.read()
                          self.send_response(resp.status)
                          for k, v in resp.headers.items():
                              if k.lower() not in HOP_BY_HOP and k.lower() != "content-length":
                                  self.send_header(k, v)
                          self.send_header("Content-Length", str(len(payload)))
                          self.end_headers()
                          self.wfile.write(payload)
                  except urllib.error.HTTPError as exc:
                      payload = exc.read()
                      self.send_response(exc.code)
                      for k, v in exc.headers.items():
                          if k.lower() not in HOP_BY_HOP and k.lower() != "content-length":
                              self.send_header(k, v)
                      self.send_header("Content-Length", str(len(payload)))
                      self.end_headers()
                      self.wfile.write(payload)

              def do_GET(self): self._proxy()
              def do_HEAD(self): self._proxy()
              def do_POST(self): self._proxy()
              def do_PUT(self): self._proxy()
              def do_PATCH(self): self._proxy()
              def do_DELETE(self): self._proxy()

          http.server.ThreadingHTTPServer(("127.0.0.1", 8090), Proxy).serve_forever()
          PY
          BASIC_USER="$USERNAME" BASIC_PASS="$PASSWORD" python /tmp/basic_proxy.py >/tmp/basic_proxy.log 2>&1 &
          echo $! >/tmp/basic_proxy.pid
          sleep 1
          curl -fsS -u "$USERNAME:$PASSWORD" http://127.0.0.1:8090/health >/dev/null

      - name: Start Cloudflare quick tunnel
        id: tunnel
        shell: bash
        run: |
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /tmp/cloudflared
          chmod +x /tmp/cloudflared
          /tmp/cloudflared tunnel --url http://127.0.0.1:8090 --no-autoupdate >/tmp/cloudflared.log 2>&1 &
          echo $! >/tmp/cloudflared.pid
          for i in $(seq 1 60); do
            URL="$(grep -oE 'https://[-a-zA-Z0-9.]+\.trycloudflare\.com' /tmp/cloudflared.log | head -n 1 || true)"
            if [ -n "$URL" ]; then
              echo "url=$URL" >> "$GITHUB_OUTPUT"
              {
                echo "URL=$URL"
                echo "USERNAME=${{ steps.auth.outputs.username }}"
                echo "PASSWORD=${{ steps.auth.outputs.password }}"
                echo "MODEL=${{ inputs.model_name }}"
              } > "$RUNNER_TEMP/local-llm-server-connection-info.txt"
              echo "::notice title=Temporary URL::$URL"
              exit 0
            fi
            cat /tmp/cloudflared.log || true
            sleep 2
          done
          cat /tmp/cloudflared.log || true
          exit 1

      - name: Upload connection info
        uses: actions/upload-artifact@v6
        with:
          name: local-llm-server-connection-info
          path: ${{ runner.temp }}/local-llm-server-connection-info.txt
          if-no-files-found: error
          retention-days: 1

      - name: Keep session alive
        run: |
          echo "${{ steps.tunnel.outputs.url }}"
          echo "Keeping session alive for ${{ inputs.minutes }} minutes..."
          sleep "$(( ${{ inputs.minutes }} * 60 ))"

      - name: Collect logs
        if: always()
        run: |
          docker logs local-llm-server >/tmp/local-llm-server.log 2>&1 || true
          cp "$RUNNER_TEMP/smoke.json" /tmp/smoke.json 2>/dev/null || true
          cp /tmp/cloudflared.log /tmp/cloudflared.log.copy 2>/dev/null || true
          cp /tmp/basic_proxy.log /tmp/basic_proxy.log.copy 2>/dev/null || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: local-llm-server-interactive-logs
          path: |
            /tmp/local-llm-server.log
            /tmp/smoke.json
            /tmp/cloudflared.log.copy
            /tmp/basic_proxy.log.copy
          if-no-files-found: warn
          retention-days: 3
