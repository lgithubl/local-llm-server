name: Build Image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag
        required: false
        default: m40
      cuda_architectures:
        description: CUDA architectures to compile for. Tesla M40 uses 52.
        required: false
        default: "52"
      llama_cpp_ref:
        description: llama.cpp git ref to build
        required: false
        default: master
      export_artifact:
        description: Export image tar.gz artifact
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image name
        id: image
        shell: bash
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER}/local-llm-server:${{ inputs.tag }}"
          echo "image=${IMAGE,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.image }}
          build-args: |
            CUDA_ARCHITECTURES=${{ inputs.cuda_architectures }}
            LLAMA_CPP_REF=${{ inputs.llama_cpp_ref }}

      - name: Write image summary
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Docker image

          Published image:

          \`\`\`text
          ${{ steps.image.outputs.image }}
          \`\`\`

          Pull it with:

          \`\`\`bash
          docker pull ${{ steps.image.outputs.image }}
          \`\`\`
          EOF

      - name: Smoke test runtime dependencies
        shell: bash
        run: |
          docker pull "${{ steps.image.outputs.image }}"
          docker run --rm --entrypoint /bin/sh "${{ steps.image.outputs.image }}" -c \
            "ldd /app/llama-server | tee /tmp/ldd.txt; ! grep 'not found' /tmp/ldd.txt | grep -v 'libcuda.so.1'"

      - name: Export image tarball
        if: inputs.export_artifact == 'true'
        shell: bash
        run: |
          docker pull "${{ steps.image.outputs.image }}"
          docker save "${{ steps.image.outputs.image }}" | gzip > local-llm-server-${{ inputs.tag }}.tar.gz

      - name: Upload image artifact
        if: inputs.export_artifact == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: local-llm-server-${{ inputs.tag }}
          path: local-llm-server-${{ inputs.tag }}.tar.gz
          if-no-files-found: error
          retention-days: 30

      - name: Write local image artifact summary
        if: inputs.export_artifact == 'true'
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Local Docker image artifact

          Download the artifact named \`local-llm-server-${{ inputs.tag }}\` from this workflow run.

          The downloaded zip contains:

          \`\`\`text
          local-llm-server-${{ inputs.tag }}.tar.gz
          \`\`\`

          Load it locally with:

          \`\`\`bash
          gzip -dc local-llm-server-${{ inputs.tag }}.tar.gz | docker load
          docker image inspect ${{ steps.image.outputs.image }}
          \`\`\`
          EOF
